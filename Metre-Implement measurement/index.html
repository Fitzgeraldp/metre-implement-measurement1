<!DOCTYPE html>
<html>

<head>
    <title>Metric/Imperial Unit Conversion</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <h1>Metric/Imperial Unit Conversion</h1>
    <input type="number" id="value" placeholder="Enter number">

    <br>

    <button>Convert</button>
    <div id="result">
        <h2>Length (Meter/Feet)</h2>
        <p id="lengthResult">meters = feet | feet = meters</p>

        <h2>Volume (Liters/Gallons)</h2>
        <p id="volumeResult">liters = gallons | gallons = liters</p>

        <h2>Mass (Kilograms/Pounds)</h2>
        <p id="massResult">kilograms = pounds | pounds = kilograms</p>
    </div>
    <script src="index.js"></script>

</body>

</html>
